services:
  lazycb:
    build: .
    container_name: lazycb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ./data:/data
