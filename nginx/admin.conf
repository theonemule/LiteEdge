server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/litewaf-security.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /data/acme/challenges;
        auth_basic off;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /data/certs/_admin/fullchain.pem;
    ssl_certificate_key /data/certs/_admin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/litewaf-security.conf;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    location /assets/ {
        auth_basic "LiteWAF";
        auth_basic_user_file /data/auth/.htpasswd;
        alias /opt/litewaf/ui/;
    }

    location / {
        auth_basic "LiteWAF";
        auth_basic_user_file /data/auth/.htpasswd;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/litewaf/cgi/admin.sh;
        fastcgi_param SCRIPT_NAME /admin.sh;
        fastcgi_param PATH_INFO $uri;
        fastcgi_pass unix:/run/fcgiwrap.sock;
    }
}
