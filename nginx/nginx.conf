include /etc/nginx/modules-enabled/*.conf;

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    log_format litewaf '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log litewaf;
    error_log /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Docker embedded DNS. Proxy targets are rendered through variables so
    # container/service names are resolved at request time rather than nginx -t.
    resolver 127.0.0.11 ipv6=off valid=30s;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/litewaf-sites/*.conf;
}
